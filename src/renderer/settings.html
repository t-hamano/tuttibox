<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
	<link rel="stylesheet" href="settings.css">
	<title>Settings</title>
</head>
<body>
	<button id="close" type="button" class="close" aria-label="Close" title="Close">
		<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
	</button>
	<main>
		<h1>Settings</h1>

		<label class="row">
			<span class="text">
				<span class="label">Launch at login</span>
				<span id="login-note" class="note">Start Tuttibox automatically when you sign in to your computer.</span>
			</span>
			<input id="open-at-login" class="toggle" type="checkbox" role="switch">
		</label>
	</main>
	<script src="settings.js"></script>
</body>
</html>
